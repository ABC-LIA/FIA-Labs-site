name: Deploy safeguard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Authorised commit identity
        run: node scripts/check-deploy-author.mjs
      - name: TypeScript validation
        run: npm run typecheck
